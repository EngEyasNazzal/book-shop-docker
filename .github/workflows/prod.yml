name: Production Pipeline

on:
  push:
    branches:
      - prod

jobs:
  production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Tested Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book-shop-docker:test-latest

      - name: Tag Production Image
        run: |
          docker tag \
          ${{ secrets.DOCKERHUB_USERNAME }}/book-shop-docker:test-latest \
          ${{ secrets.DOCKERHUB_USERNAME }}/book-shop-docker:prod-latest

      - name: Push Production Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-shop-docker:prod-latest
