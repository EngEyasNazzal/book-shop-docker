name: Dev Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Unique Artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz \
            --exclude=.git \
            --exclude=artifacts \
            --exclude=__pycache__ \
            .

      - name: Commit Artifact Back To Repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add artifacts/
          git commit -m "Add dev artifact ${{ github.sha }}" || echo "No artifact changes"
          git push origin dev

      - name: Build Docker Image From Artifact
        run: |
          docker build \
            --build-arg ARTIFACT=artifacts/app-${{ github.sha }}.tar.gz \
            -t bookshop-dev:${{ github.sha }} .

      - name: Run Container Test
        run: |
          docker run -d -p 8000:8000 --name bookshop-dev bookshop-dev:${{ github.sha }}
          sleep 10
          docker ps
