services:
  db:
    image: postgres:15
    container_name: bookshop_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookshop_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bookshop_backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - bookshop_network

  nginx:
    image: nginx:latest
    container_name: bookshop_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - backend
    networks:
      - bookshop_network

volumes:
  postgres_data:
  static_volume:

networks:
  bookshop_network:
    driver: bridge
